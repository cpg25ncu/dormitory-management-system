name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Java 17 and H2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build, test and check coverage
        run: mvn -B clean verify
      - name: Summarize coverage
        if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
        run: python3 scripts/coverage-summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('target/site/jacoco/index.html') != ''
        with:
          name: coverage-report
          path: target/site/jacoco/
      - uses: actions/upload-artifact@v7
        with:
          name: dormitory-manager
          path: target/dormitory-management-system-*.jar
          if-no-files-found: error
  browser:
    name: Browser workflow
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: dormitory-manager
          path: target
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
  mysql:
    name: MySQL 8.4 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run the suite against MySQL 8.4 with Testcontainers
        run: mvn -B clean verify -Ddormitory.test.database=mysql
  container:
    name: Docker Compose deployment
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DORM_DB_PASSWORD: ci-compose-db-password
      DORM_ADMIN_PASSWORD: ci-compose-admin-password
      DORM_TIME_ZONE: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build the image from source and wait for health checks
        run: docker compose up --build --wait --wait-timeout 300
      - name: Sign in and run a housing workflow against MySQL
        run: node scripts/smoke-test.mjs --write http://127.0.0.1:8080/
      - if: failure()
        run: docker compose logs --no-color app
      - if: always()
        run: docker compose down --volumes
