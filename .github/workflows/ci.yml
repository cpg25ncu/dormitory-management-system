name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Java 17 and H2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: dormitory-manager
          path: target/dormitory-management-system-*.jar
          if-no-files-found: error
  browser:
    name: Browser workflow
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dormitory-manager
          path: target
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
  mysql:
    name: MySQL 8.4 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dormitory_test
          MYSQL_USER: dormitory_test
          MYSQL_PASSWORD: ci-test-password
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysql --protocol=TCP -h 127.0.0.1 -u dormitory_test -pci-test-password dormitory_test -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=4s
          --health-retries=24
    env:
      DORM_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/dormitory_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
      DORM_TEST_DB_USERNAME: dormitory_test
      DORM_TEST_DB_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean verify
  container:
    name: Docker Compose startup
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DORM_DB_PASSWORD: ci-compose-db-password
      DORM_ADMIN_PASSWORD: ci-compose-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dormitory-manager
          path: target
      - run: docker compose up --build -d
      - name: Verify administrator bootstrap
        run: |
          python3 - <<'PY'
          import http.cookiejar
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import build_opener, HTTPCookieProcessor, Request

          base = "http://127.0.0.1:8080/api"
          browser = build_opener(HTTPCookieProcessor(http.cookiejar.CookieJar()))
          for attempt in range(45):
              try:
                  session = json.load(browser.open(base + "/session", timeout=3))
                  request = Request(base + "/login",
                      data=urlencode({"username": "admin", "password": os.environ["DORM_ADMIN_PASSWORD"]}).encode(),
                      headers={session["csrfHeader"]: session["csrfToken"]})
                  with browser.open(request, timeout=3) as response:
                      assert response.status == 204
                  break
              except OSError:
                  if attempt == 44:
                      raise
                  time.sleep(2)

          session = json.load(browser.open(base + "/session", timeout=3))
          assert session["user"]["role"] == "ADMIN"
          assert session["demo"] is False
          assert json.load(browser.open(base + "/buildings", timeout=3)) == []
          PY
      - if: failure()
        run: docker compose logs --no-color app
      - if: always()
        run: docker compose down --volumes
