spring.application.name=dormitory-management-system
spring.datasource.url=${DORM_DB_URL:jdbc:mysql://localhost:3306/dormitory?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.mvc.problemdetails.enabled=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DORM_DB_USERNAME:dormitory}
spring.datasource.password=${DORM_DB_PASSWORD:}
spring.jackson.time-zone=UTC
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${DORM_SECURE_COOKIE:false}
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
dormitory.bootstrap.username=${DORM_ADMIN_USERNAME:admin}
dormitory.bootstrap.password=${DORM_ADMIN_PASSWORD:}
dormitory.bootstrap.demo=false
