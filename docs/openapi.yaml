openapi: 3.0.3
info:
  title: Dormitory Management System API
  version: 1.1.0
  description: >
    Same-origin API for residence operations. Administrators can see all buildings.
    Staff can see only their assigned buildings, including the rooms, residents and
    absence records for those buildings.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Report whether the application and its database are available
      security: []
      description: Liveness and readiness probes are available at /actuator/health/liveness and /actuator/health/readiness.
      responses:
        '200':
          description: The application is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
        '503': { description: The application or its database is unavailable }
  /api/session:
    get:
      operationId: getSession
      summary: Read the current identity and CSRF token
      security: []
      responses:
        '200':
          description: Session state. The user is null for a signed-out client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /api/login:
    post:
      operationId: signIn
      summary: Sign in with a username and password
      description: >
        Read the session again after signing in to obtain the current CSRF token. Five failed attempts for one
        username from one client address within 15 minutes lock that pair for 15 minutes, even with the
        correct password.
      security: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '204': { description: Signed in }
        '401': { description: Credentials rejected }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: Too many failed attempts for this username from this address
          headers:
            Retry-After:
              description: Seconds until sign-in is allowed again
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/logout:
    post:
      operationId: signOut
      summary: End the session
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: Session ended }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/password:
    put:
      operationId: changePassword
      summary: Change the current user's password and end the session
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/buildings:
    get:
      operationId: listBuildings
      summary: List visible buildings
      responses:
        '200':
          description: Buildings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Building' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/rooms:
    get:
      operationId: listRooms
      summary: List visible rooms with current occupancy
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Room' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/residents:
    get:
      operationId: listResidents
      summary: List visible students with an active stay
      responses:
        '200':
          description: Residents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Resident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/absences:
    get:
      operationId: listAbsences
      summary: Search visible absence records, most recent first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/AbsenceQuery'
        - $ref: '#/components/parameters/AbsenceStatus'
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: A page of absence records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbsencePage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: recordAbsence
      summary: Record an absence for an active stay in a visible building
      description: >
        If a withdrawn record exists for the same stay and date, it is restored with the new reason and recorder
        instead of adding a second record.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAbsence' }
      responses:
        '201': { description: Absence recorded }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/absences/export.csv:
    get:
      operationId: exportAbsences
      summary: Export visible absence records as CSV
      description: >
        Every record that matches the filters, without paging. Cells that start with = + - @, a tab or a carriage return get a leading apostrophe so spreadsheets do not run them as formulas. Times use the residence's time zone.
      parameters:
        - $ref: '#/components/parameters/AbsenceQuery'
        - $ref: '#/components/parameters/AbsenceStatus'
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: A CSV attachment with a UTF-8 byte order mark
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/absences/{id}:
    put:
      operationId: correctAbsence
      summary: Correct the date or reason of an active absence record in a visible building
      description: >
        The date must fall within the stay, from its check-in day to its checkout day or today. To change
        the resident, withdraw the record and record a new one.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbsenceCorrection' }
      responses:
        '204': { description: Record corrected }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/absences/{id}/withdraw:
    post:
      operationId: withdrawAbsence
      summary: Withdraw an active absence record in a visible building
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '204': { description: Record withdrawn }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/buildings:
    post:
      operationId: createBuilding
      summary: Create a building
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody: { $ref: '#/components/requestBodies/Building' }
      responses:
        '201': { description: Building created }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/buildings/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Csrf'
    put:
      operationId: updateBuilding
      summary: Update a building and assign or clear its staff account
      requestBody: { $ref: '#/components/requestBodies/Building' }
      responses:
        '204': { description: Building updated }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteBuilding
      summary: Delete a building with no linked rooms
      responses:
        '204': { description: Building deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/rooms:
    post:
      operationId: createRoom
      summary: Create a room in an existing building
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RoomInput'
                - type: object
                  required: [buildingId]
                  properties:
                    buildingId: { $ref: '#/components/schemas/Id' }
      responses:
        '201': { description: Room created }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Csrf'
    put:
      operationId: updateRoom
      summary: Update the room number and capacity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomInput' }
      responses:
        '204': { description: Room updated }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteRoom
      summary: Delete a room with no housing history
      responses:
        '204': { description: Room deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/students:
    get:
      operationId: listStudents
      summary: Search student records and their housing status, ordered by name
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/StudentQuery'
        - $ref: '#/components/parameters/HousingStatus'
        - $ref: '#/components/parameters/GenderFilter'
      responses:
        '200':
          description: A page of students
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentPage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createStudent
      summary: Create a student record
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody: { $ref: '#/components/requestBodies/Student' }
      responses:
        '201': { description: Student created }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/students/export.csv:
    get:
      operationId: exportStudents
      summary: Export student records as CSV
      description: >
        Every record that matches the filters, without paging. Cells that start with = + - @, a tab or a carriage return get a leading apostrophe so spreadsheets do not run them as formulas. Times use the residence's time zone.
      parameters:
        - $ref: '#/components/parameters/StudentQuery'
        - $ref: '#/components/parameters/HousingStatus'
        - $ref: '#/components/parameters/GenderFilter'
      responses:
        '200':
          description: A CSV attachment with a UTF-8 byte order mark
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/students/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Csrf'
    put:
      operationId: updateStudent
      summary: Update a student's directory record
      requestBody: { $ref: '#/components/requestBodies/Student' }
      responses:
        '204': { description: Student updated }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteStudent
      summary: Delete a student with no housing history
      responses:
        '204': { description: Student deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/students/{id}/check-in:
    post:
      operationId: checkInStudent
      summary: Assign an available bed to a student
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody: { $ref: '#/components/requestBodies/Assignment' }
      responses:
        '201': { description: Stay opened }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/students/{id}/transfer:
    post:
      operationId: transferStudent
      summary: Move an active resident to another room with an available bed
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody: { $ref: '#/components/requestBodies/Assignment' }
      responses:
        '204': { description: Transfer completed }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/students/{id}/checkout:
    post:
      operationId: checkOutStudent
      summary: Close an active stay and release the bed
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '204': { description: Stay closed }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/housing/history:
    get:
      operationId: listHousingHistory
      summary: Search closed stays, including transfers and checkouts, most recent first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/HistoryQuery'
        - $ref: '#/components/parameters/DepartureType'
        - $ref: '#/components/parameters/DepartedFrom'
        - $ref: '#/components/parameters/DepartedTo'
      responses:
        '200':
          description: A page of closed stays
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeparturePage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/housing/history/export.csv:
    get:
      operationId: exportHousingHistory
      summary: Export closed stays as CSV
      description: >
        Every record that matches the filters, without paging. Cells that start with = + - @, a tab or a carriage return get a leading apostrophe so spreadsheets do not run them as formulas. Times use the residence's time zone.
      parameters:
        - $ref: '#/components/parameters/HistoryQuery'
        - $ref: '#/components/parameters/DepartureType'
        - $ref: '#/components/parameters/DepartedFrom'
        - $ref: '#/components/parameters/DepartedTo'
      responses:
        '200':
          description: A CSV attachment with a UTF-8 byte order mark
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/staff:
    get:
      operationId: listStaff
      summary: List staff accounts
      responses:
        '200':
          description: Staff accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Staff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createStaff
      summary: Create a staff account
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, displayName, password]
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9._-]{3,40}$' }
                displayName: { $ref: '#/components/schemas/Name' }
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '201': { description: Staff account created }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/staff/{id}:
    put:
      operationId: updateStaff
      summary: Update a staff member's display name and enabled status
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, enabled]
              properties:
                displayName: { $ref: '#/components/schemas/Name' }
                enabled: { type: boolean }
      responses:
        '204': { description: Staff account updated }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/staff/{id}/password:
    put:
      operationId: resetStaffPassword
      summary: Replace a staff password and invalidate the account's sessions
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '204': { description: Password reset }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Preserve this cookie across requests. All admin routes require the ADMIN role.
  parameters:
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Use the csrfHeader name and csrfToken value from GET /api/session with its session cookie.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Page:
      name: page
      in: query
      description: Page number, starting at 0.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StudentQuery:
      name: q
      in: query
      description: >
        Case-insensitive text contained in the name, student number, program, email, phone, building or room.
        Wildcard characters such as % and _ match literally.
      schema: { type: string, maxLength: 100 }
    AbsenceQuery:
      name: q
      in: query
      description: Case-insensitive text contained in the resident's name, student number or the reason.
      schema: { type: string, maxLength: 100 }
    HistoryQuery:
      name: q
      in: query
      description: Case-insensitive text contained in the student's name, student number or the departure reason.
      schema: { type: string, maxLength: 100 }
    HousingStatus:
      name: status
      in: query
      schema: { type: string, enum: [resident, unassigned, checked_out] }
    GenderFilter:
      name: gender
      in: query
      description: A recorded gender, or none for students without one.
      schema: { type: string, enum: [female, male, none] }
    AbsenceStatus:
      name: status
      in: query
      description: Which records to include. Withdrawn records stay available for review.
      schema: { type: string, enum: [active, withdrawn, all], default: active }
    BuildingId:
      name: buildingId
      in: query
      description: Limits results to one building. A building outside a staff account's assignment matches nothing.
      schema: { $ref: '#/components/schemas/Id' }
    From:
      name: from
      in: query
      description: First absence date to include.
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Last absence date to include. Must not be before from.
      schema: { type: string, format: date }
    DepartureType:
      name: type
      in: query
      schema: { type: string, enum: [transfer, checkout] }
    DepartedFrom:
      name: from
      in: query
      description: First departure day to include, in the residence's time zone.
      schema: { type: string, format: date }
    DepartedTo:
      name: to
      in: query
      description: Last departure day to include, in the residence's time zone. Must not be before from.
      schema: { type: string, format: date }
  requestBodies:
    Building:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BuildingInput' }
    Student:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StudentInput' }
    Assignment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [roomId]
            properties:
              roomId: { $ref: '#/components/schemas/Id' }
  responses:
    Invalid:
      description: Invalid request data
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Sign-in required
    Forbidden:
      description: Role denied or CSRF token missing or invalid
    NotFound:
      description: The requested record was not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: >
        The request conflicts with existing records or current housing state. Housing conflicts include a full
        room, an existing assignment, a student without a recorded gender, a building gender policy, roommates
        of another gender, and policy or gender edits that would not fit current residents.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Id: { type: integer, format: int64, minimum: 1 }
    PageInfo:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    StudentPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Student' } }
    AbsencePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Absence' } }
    DeparturePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Departure' } }
    Name: { type: string, minLength: 1, maxLength: 80 }
    Reason: { type: string, minLength: 1, maxLength: 240 }
    NewPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 72
      description: Must fit within 72 UTF-8 bytes.
    Session:
      type: object
      required: [user, csrfHeader, csrfToken, timeZone, demo, demoAccounts]
      properties:
        user:
          type: object
          nullable: true
          required: [username, displayName, role]
          properties:
            username: { type: string }
            displayName: { type: string }
            role: { type: string, enum: [ADMIN, STAFF] }
        csrfHeader: { type: string }
        csrfToken: { type: string }
        timeZone:
          type: string
          example: Asia/Shanghai
          description: IANA time zone of the residence. Calendar dates such as absence dates follow this zone.
        demo: { type: boolean }
        demoAccounts:
          type: array
          description: Sign-in options offered by the demo profile. Always empty outside the demo.
          items:
            type: object
            required: [role, username, password]
            properties:
              role: { type: string, enum: [ADMIN, STAFF] }
              username: { type: string }
              password: { type: string, format: password }
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, minLength: 1, maxLength: 72 }
        newPassword: { $ref: '#/components/schemas/NewPassword' }
    Gender:
      type: string
      enum: [FEMALE, MALE]
    GenderPolicy:
      type: string
      enum: [MIXED, FEMALE_ONLY, MALE_ONLY]
      description: Which students a building houses. Rooms in every building house a single gender.
    Building:
      type: object
      required: [id, name, description, genderPolicy, managerId, managerName]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        description: { type: string }
        genderPolicy: { $ref: '#/components/schemas/GenderPolicy' }
        managerId: { type: integer, format: int64, nullable: true }
        managerName: { type: string, nullable: true }
    BuildingInput:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        description: { type: string, maxLength: 240, nullable: true }
        genderPolicy:
          allOf: [{ $ref: '#/components/schemas/GenderPolicy' }]
          nullable: true
          description: Defaults to MIXED. A change is rejected with 409 when a current resident does not match.
        managerId: { type: integer, format: int64, minimum: 1, nullable: true }
    Room:
      type: object
      required: [id, roomNumber, buildingId, buildingName, genderPolicy, capacity, occupied, residentGender]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        roomNumber: { type: string }
        buildingId: { $ref: '#/components/schemas/Id' }
        buildingName: { type: string }
        genderPolicy: { $ref: '#/components/schemas/GenderPolicy' }
        capacity: { type: integer, minimum: 1, maximum: 30 }
        occupied: { type: integer, minimum: 0 }
        residentGender:
          type: string
          enum: [FEMALE, MALE, MIXED]
          nullable: true
          description: >
            The gender shared by all current residents. Null for an empty room. MIXED when residents differ or
            include a student whose gender is not recorded.
    RoomInput:
      type: object
      required: [roomNumber, capacity]
      properties:
        roomNumber: { type: string, minLength: 1, maxLength: 30 }
        capacity: { type: integer, minimum: 1, maximum: 30 }
    Student:
      type: object
      required: [id, studentNumber, fullName, gender, program, phone, email, stayId, roomId, roomNumber, buildingName, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        studentNumber: { type: string }
        fullName: { type: string }
        gender:
          allOf: [{ $ref: '#/components/schemas/Gender' }]
          nullable: true
          description: Null for records created before genders were recorded. Required before a check-in or transfer.
        program: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        stayId: { type: integer, format: int64, nullable: true }
        roomId: { type: integer, format: int64, nullable: true }
        roomNumber: { type: string, nullable: true }
        buildingName: { type: string, nullable: true }
        status: { type: string, enum: [RESIDENT, UNASSIGNED, CHECKED_OUT] }
    StudentInput:
      type: object
      required: [studentNumber, fullName, gender]
      properties:
        studentNumber: { type: string, minLength: 1, maxLength: 40 }
        fullName: { $ref: '#/components/schemas/Name' }
        gender:
          allOf: [{ $ref: '#/components/schemas/Gender' }]
          description: A change is rejected with 409 when it does not fit the student's current building or roommates.
        program: { type: string, maxLength: 100, nullable: true }
        phone: { type: string, maxLength: 30, pattern: '^[0-9+()\-. ]*$', nullable: true }
        email: { type: string, format: email, maxLength: 120, nullable: true }
    Resident:
      type: object
      required: [stayId, studentId, studentNumber, fullName, roomId, roomNumber, buildingId, buildingName]
      properties:
        stayId: { $ref: '#/components/schemas/Id' }
        studentId: { $ref: '#/components/schemas/Id' }
        studentNumber: { type: string }
        fullName: { type: string }
        roomId: { $ref: '#/components/schemas/Id' }
        roomNumber: { type: string }
        buildingId: { $ref: '#/components/schemas/Id' }
        buildingName: { type: string }
    Absence:
      type: object
      required: [id, stayId, absenceDate, reason, studentNumber, fullName, roomNumber, buildingId, buildingName, recordedBy, recordedAt,
        updatedBy, updatedAt, status, withdrawnBy, withdrawnAt, withdrawalReason]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        stayId: { $ref: '#/components/schemas/Id' }
        absenceDate: { type: string, format: date }
        reason: { type: string }
        studentNumber: { type: string }
        fullName: { type: string }
        roomNumber: { type: string }
        buildingId: { $ref: '#/components/schemas/Id' }
        buildingName: { type: string }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
        updatedBy: { type: string, nullable: true, description: Who last corrected the record. }
        updatedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [ACTIVE, WITHDRAWN] }
        withdrawnBy: { type: string, nullable: true }
        withdrawnAt: { type: string, format: date-time, nullable: true }
        withdrawalReason: { type: string, nullable: true }
    AbsenceCorrection:
      type: object
      required: [absenceDate, reason]
      properties:
        absenceDate: { type: string, format: date, description: A calendar day of the stay in the residence's time zone. }
        reason: { $ref: '#/components/schemas/Reason' }
    NewAbsence:
      type: object
      required: [stayId, absenceDate, reason]
      properties:
        stayId: { $ref: '#/components/schemas/Id' }
        absenceDate: { type: string, format: date, description: Calendar date in the residence's time zone, at or before today. }
        reason: { $ref: '#/components/schemas/Reason' }
    Departure:
      type: object
      required: [id, studentNumber, fullName, roomNumber, buildingName, checkInAt, checkOutAt, departureType, departureReason, processedBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        studentNumber: { type: string }
        fullName: { type: string }
        roomNumber: { type: string }
        buildingName: { type: string }
        checkInAt: { type: string, format: date-time }
        checkOutAt: { type: string, format: date-time }
        departureType: { type: string, enum: [TRANSFER, CHECKOUT] }
        departureReason: { type: string }
        processedBy: { type: string }
    Staff:
      type: object
      required: [id, username, displayName, enabled]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        displayName: { type: string }
        enabled: { type: boolean }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
