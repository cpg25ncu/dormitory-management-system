<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15362d">
    <meta name="description" content="Manage residence buildings, room assignments, occupancy and absence records.">
    <title>Dormitory Manager</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" type="module"></script>
</head>
<body>
    <p class="loading" id="loading" role="status">Connecting to Dormitory Manager…</p>
    <main class="sign-in" id="sign-in" hidden>
        <section class="auth-intro" aria-labelledby="sign-in-title">
            <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Dormitory Manager</span></div>
            <div class="auth-copy">
                <h1 id="sign-in-title">Residence<br> management</h1>
                <p>Manage room assignments, track availability and keep daily residence records in one place.</p>
            </div>
        </section>
        <section class="auth-body" aria-labelledby="auth-heading">
            <form class="auth-form" id="login-form" method="post">
                <h2 id="auth-heading">Sign in</h2>
                <label>Username<input name="username" autocomplete="username" spellcheck="false" required maxlength="40"></label>
                <label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="72"></label>
                <p class="form-error" id="login-error" role="alert" hidden></p>
                <button class="button primary" type="submit">Sign in</button>
                <div class="demo-example" id="demo-options" hidden>
                    <p>Local demo accounts</p>
                    <div class="actions">
                        <button type="button" class="button subtle" id="demo-admin">Use administrator</button>
                        <button type="button" class="button subtle" id="demo-staff">Use staff</button>
                    </div>
                </div>
            </form>
        </section>
    </main>
    <div class="shell" id="shell" hidden>
        <aside class="sidebar">
            <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true"></span><span>Dormitory Manager</span></a>
            <nav id="navigation" aria-label="Workspace"></nav>
            <div class="identity">
                <div class="avatar" id="avatar" aria-hidden="true"></div>
                <div class="identity-label"><strong id="display-name"></strong><span id="role"></span></div>
            </div>
        </aside>
        <div class="workspace">
            <header class="utility">
                <span id="breadcrumb"></span>
                <div class="actions">
                    <button class="button subtle" type="button" id="change-password">Change password</button>
                    <button class="button neutral" type="button" id="logout">Sign out</button>
                </div>
            </header>
            <main id="view" tabindex="-1"></main>
        </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
        <form id="dialog-form">
            <div class="dialog-heading">
                <h2 id="dialog-title"></h2>
                <button class="button subtle close" id="close-dialog" type="button" aria-label="Close dialog">×</button>
            </div>
            <div class="dialog-fields" id="dialog-fields"></div>
            <p class="form-error" id="dialog-error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button class="button neutral" id="cancel-dialog" type="button">Cancel</button>
                <button class="button primary" id="dialog-submit" type="submit">Save</button>
            </div>
        </form>
    </dialog>
    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
</body>
</html>
